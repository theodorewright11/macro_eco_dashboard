# Refresh the FRED data every Monday morning and commit it. If the repo is
# connected to Vercel (or Netlify, or GitHub Pages), the push redeploys the site.
name: Refresh FRED data

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC, after Friday's jobs report
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-fred.mjs
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fred
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh FRED data"
            git push
          fi
